<script>
  const products = [
    { name: "Yellow Chalk", price: 50, img: "https://hbw.ph/wp-content/uploads/2017/10/12-pcs-yellow-chalk-600x600.jpg" },
    { name: "Whiteboard Marker", price: 50, img: "https://tse4.mm.bing.net/th/id/OIP.813J5kYxiDg4Mbc7jeiS7wHaHa?w=1000&h=1000&rs=1&pid=ImgDetMain&o=7&rm=3" },
    { name: "Marker Ink", price: 50, img: "https://5.imimg.com/data5/SELLER/Default/2022/5/GV/MR/NG/5825020/camlin-permanent-marker-pen-ink-1000x1000.jpg" },
    { name: "Magnetic Whiteboard", price: 50, img: "https://designerpinboards.com.au/wp-content/uploads/2021/10/VB1290.jpg" },
    { name: "White Board", price: 50, img: "https://5.imimg.com/data5/SELLER/Default/2023/12/366198772/QO/FW/ZY/24774044/white-board-1000x1000.jpg" },
    { name: "Erasers in Jar", price: 50, img: "https://sellet.in/wp-content/uploads/2024/03/Photoroom-20240309_132611_27-600x388.jpg" },
    { name: "Ballpen", price: 50, img: "https://b2601588.smushcdn.com/2601588/wp-content/uploads/2023/05/Picsart_23-06-09_13-44-47-409.jpg?lossy=1&strip=1&webp=1" },
    { name: "Thumbtacks", price: 50, img: "https://cf.shopee.ph/file/cada3cec8b4d058ba64b9a812560607b" },
    { name: "Clear File", price: 50, img: "https://cpimg.tistatic.com/06020413/b/4/Clear-File-Folder.jpg" },
    { name: "Sketch Pad", price: 50, img: "https://images.thimbletoys.com/images/items/1630227a.jpg" },
    { name: "Report Cover", price: 50, img: "https://media.kohlsimg.com/is/image/kohls/6359601?wid=600&hei=600&op_sharpen=1" },
    { name: "Yellow Pad", price: 50, img: "https://tse3.mm.bing.net/th/id/OIP.Rl1YOqF3RIfLTNNZB1KCCwHaJ4?rs=1&pid=ImgDetMain&o=7&rm=3" },
    { name: "Stapler HBW", price: 50, img: "https://tse4.mm.bing.net/th/id/OIP.GAk9vbw5QxWbso8fijbRegAAAA?w=300&h=300&rs=1&pid=ImgDetMain&o=7&rm=3" },
    { name: "Colored Pad", price: 50, img: "https://m.media-amazon.com/images/I/41I7vKcxSlL._AC_.jpg" },
    { name: "Oil Pastels Color", price: 50, img: "https://5.imimg.com/data5/SELLER/Default/2021/5/RB/XD/JS/20774374/camel-15-shades-oil-pastel-crayons-500x500.jpg" },
    { name: "Plastic Cover", price: 50, img: "https://5.imimg.com/data5/SELLER/Default/2024/10/455616892/RK/AS/ZS/1707793/plastic-covers-1000x1000.jpg" },
    { name: "Storage bins", price: 50, img: "https://tse1.mm.bing.net/th/id/OIP.dD7Txsiq2Bi35CZLEg9IywHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" },
    { name: "Globe", price: 50, img: "https://5.imimg.com/data5/SELLER/Default/2021/5/GZ/CF/UF/34174419/globe-8-inch-1000x1000.jpg" },
  ];

  const grid = document.getElementById('productGrid');

  
    function viewProduct(product) {
      localStorage.setItem("selectedProduct", JSON.stringify(product));
      window.location.href = "PRODUCTDETAILS.html";
    }

  function loadProducts() {
    grid.innerHTML = '';
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${p.img}" alt="${p.name}" onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">  <!-- Made image clickable to view details -->
          <h3 onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">${p.name}</h3>  <!-- Made title clickable too -->
          <p class="price">₱${p.price}.00</p>
          <div class="buttons">
            <label class="heart-toggle">
              <input type="checkbox" onchange="addToFavorites('${p.name}','${p.img}',${p.price}, this)">
              <span class="heart-btn">♡</span>
            </label>
            <button class="cart-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">
              <iconify-icon icon="mdi:cart-outline"></iconify-icon>
            </button>
           <button class="buy-btn" onclick="viewProduct({ name: '${p.name}', img: '${p.img}', price: ${p.price} })">Buy</button>
          </div>
      `;
      grid.appendChild(card);
    });
  }

  function addToCart(name, img, price) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.push({ name, img, price });
    localStorage.setItem('cart', JSON.stringify(cart));
    alert(`${name} added to cart!`);
  }

  function addToFavorites(name, img, price, btn) {
    const favs = JSON.parse(localStorage.getItem('favorites')) || [];
    favs.push({ name, img, price });
    localStorage.setItem('favorites', JSON.stringify(favs));
    btn.classList.add('active');
  }

  function searchProducts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = products.filter(p => p.name.toLowerCase().includes(query));
    grid.innerHTML = '';
    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${p.img}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="price">₱${p.price}.00</p>
        <div class="buttons">
          <button class="buy-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">Buy</button>
           <button class="buy-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">🛒</button>
          <button class="heart-btn" onclick="addToFavorites('${p.name}','${p.img}',${p.price}, this)">♡</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  loadProducts();
</script>

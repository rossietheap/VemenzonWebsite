<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <style>
    /* Add your CSS here for styling */
    body { font-family: Arial, sans-serif; }
    .product-card { border: 1px solid #ccc; padding: 10px; margin: 10px; }
    .product-info { margin: 20px; }
    .quantity-controls { display: flex; align-items: center; }
    .quantity-controls button { margin: 0 5px; }
    #checkoutModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    #checkoutModal .modal-content { background: white; padding: 20px; border-radius: 5px; width: 400px; }
    .order-product { display: flex; margin-bottom: 10px; }
    .order-product img { width: 100px; height: 100px; margin-right: 10px; }
    .order-product-details p { margin: 0; }
  </style>
</head>
<body>
  <h1>Product Details</h1>
  <div class="product-info">
    <div class="product-image">
      <img src="" alt="Product Image" style="width: 300px; height: 300px;">
    </div>
    <h2>Product Name</h2>
    <p class="price">₱0.00</p>
    <p class="desc">Description</p>
    <div class="details"></div>
    <div class="quantity-controls">
      <button onclick="updateQuantity(-1)">-</button>
      <input type="number" id="quantity" value="1" min="1">
      <button onclick="updateQuantity(1)">+</button>
    </div>
    <button onclick="addToCart()">Add to Cart</button>
    <button onclick="buyNow()">Buy Now</button>
    <button id="reportBtn">Report</button>
  </div>

  <!-- Report Modal -->
  <div id="reportModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div class="modal-content">
      <h3>Report Product</h3>
      <textarea id="reportText" placeholder="Enter your report..."></textarea>
      <button onclick="submitReport()">Submit</button>
      <button onclick="closeReportModal()">Cancel</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal">
    <div class="modal-content">
      <h3>Checkout</h3>
      <div id="orderProductContainer"></div>
      <p>Items Price: <span id="itemsPrice">₱0.00</span></p>
      <p>Shipping Price: <span id="shippingPrice">₱30.53</span></p>
      <p>Total Price: <span id="totalPrice">₱0.00</span></p>
      
      <form id="checkoutForm">
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="firstName" placeholder="First Name" required>
        <input type="text" name="lastName" placeholder="Last Name" required>
        <input type="text" name="address1" placeholder="Address" required>
        <input type="text" name="city" placeholder="City" required>
        <input type="text" name="postalCode" placeholder="Postal Code" required>
        
        <label><input type="radio" name="deliveryMethod" value="standard" checked> Standard Shipping</label>
        <label><input type="radio" name="deliveryMethod" value="express"> Express Shipping</label>
        
        <label><input type="radio" name="paymentMethod" value="card"> Credit Card</label>
        <label><input type="radio" name="paymentMethod" value="paypal"> PayPal</label>
        
        <button type="button" onclick="finalizePurchase()">Complete Purchase</button>
        <button type="button" onclick="closeCheckoutModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    const product = JSON.parse(localStorage.getItem("selectedProduct"));

    const products = [
      { name: "Sketch Pad", price: 50, img: "https://images.thimbletoys.com/images/items/1630227a.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "High-quality sketch pad for artists." },
      { name: "Mathematics Set", price: 50, img: "https://m.media-amazon.com/images/I/81zaNKgIjpL.SS700.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Complete set for math calculations." },
      { name: "Intermediate Pad", price: 50, img: "https://img.lazcdn.com/g/ff/kf/Sc0a190ca11aa45fb9e36960294cdfd54Q.jpg_720x720q80.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Durable intermediate pad for notes." },
      { name: "Yellow pad", price: 50, img: "https://www.nationalbookstore.com/180048-thickbox_default/best-buy-yellow-pad-8-5x13-inches-80s-school-office-supplies.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Classic yellow pad for writing." },
      { name: "Colored Pad", price: 50, img: "https://m.media-amazon.com/images/I/41I7vKcxSlL._AC_.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Colorful pad for creative notes." },
    ];

    const grid = document.getElementById('productGrid');

    function viewProduct(product) {
      localStorage.setItem("selectedProduct", JSON.stringify(product));
      window.location.href = "PRODUCTDETAILS.html";
    }

    function loadProducts() {
      if (grid) {
        grid.innerHTML = '';
        products.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="${p.img}" alt="${p.name}" onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">
            <h3 onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">${p.name}</h3>
            <p class="price">₱${p.price}.00</p>
            <div class="buttons">
              <button class="buy-btn" onclick="viewProduct({ name: '${p.name}', img: '${p.img}', price: ${p.price} })">View Product</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    function addToCart(name, img, price) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name, img, price });
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${name} added to cart!`);
    }

    function addToFavorites(name, img, price, btn) {
      const favs = JSON.parse(localStorage.getItem('favorites')) || [];
      favs.push({ name, img, price });
      localStorage.setItem('favorites', JSON.stringify(favs));
      btn.classList.add('active');
    }

    function searchProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      if (grid) {
        grid.innerHTML = '';
        filtered.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="${p.img}" alt="${p.name}" onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">
            <h3 onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">${p.name}</h3>
            <p class="price">₱${p.price}.00</p>
            <div class="buttons">
              <button class="buy-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">View Product</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    loadProducts();

    if (product) {
      document.querySelector(".product-info h2").textContent = product.name;
      document.querySelector(".price").textContent = `₱${product.price}.00`;
      document.querySelector(".desc").textContent = product.description || "No description available.";
      document.querySelector(".details").innerHTML = `
        <p><strong>Brand:</strong> ${product.brand || "N/A"}</p>
        <p><strong>Stock:</strong> ${product.stock || "In Stock"}</p>
        <p><strong>Shipping:</strong> ${product.shipping || "Standard Delivery"}</p>`;
      document.querySelector(".product-image img").src = product.img;
    }

    function updateQuantity(change) {
      const quantityInput = document.getElementById("quantity");
      let value = parseInt(quantityInput.value);
      if (isNaN(value)) value = 1;
      value += change;
      if (value < 1) value = 1;
      quantityInput.value = value;
    }

    function addToCart() {
      if (!product) return alert("No product selected!");
      const quantity = parseInt(document.getElementById("quantity").value);
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      const existing = cart.find(item => item.name === product.name);
      if (existing) existing.quantity += quantity;
      else cart.push({ ...product, quantity });

      localStorage.setItem("cart", JSON.stringify(cart));
      alert(`${quantity} x ${product.name} added to cart!`);
      window.location.href = "addtocart.html";
    }

    function buyNow() {
      if (!product) return alert("No product selected!");
      const quantity = parseInt(document.getElementById("quantity").value);
      const productWithQuantity = { ...product, quantity };
      selectedItems = [productWithQuantity]; // Set for checkout modal
      renderSelectedItems();
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    const reportBtn = document.getElementById('reportBtn');
    const reportModal = document.getElementById('reportModal');

    function openReportModal() {
      reportModal.style.display = 'flex';
    }

    function closeReportModal() {
      reportModal.style.display = 'none';
    }

    function submitReport() {
      const reportText = document.getElementById('reportText').value;
      if (reportText.trim() === "") {
        alert("Please enter a report.");
        return;
      }
      alert("Report submitted: " + reportText);
      closeReportModal();
    }

    reportBtn.addEventListener('click', openReportModal);

    // Checkout modal logic (integrated from checkout script)
    let selectedItems = [];

    const orderContainer = document.getElementById('orderProductContainer');
    const itemsPriceEl = document.getElementById('itemsPrice');
    const shippingPriceEl = document.getElementById('shippingPrice');
    const totalPriceEl = document.getElementById('totalPrice');

    const shippingCostStandard = 30.53;
    const shippingCostExpress = 50.00;
    let currentShippingCost = shippingCostStandard;

    function renderSelectedItems() {
      if (selectedItems.length === 0) {
        orderContainer.innerHTML = "<p>No items selected.</p>";
        itemsPriceEl.textContent = "₱0.00";
        totalPriceEl.textContent = "₱0.00";
        return;
      }

      orderContainer.innerHTML = selectedItems.map(item => {
        const price = Number(item.price) || 0;
        const qty = Number(item.quantity) || 1;
        return `
          <div class="order-product">
            <img src="${item.img}" alt="${item.name}" />
            <div class="order-product-details">
              <p>${item.name}</p>
              <p>Quantity: ${qty}</p>
              <p>₱${(price * qty).toFixed(2)}</p>
            </div>
          </div>
        `;
      }).join('');

      updatePrices();
    }

    function updatePrices() {
      const itemsPrice = selectedItems.reduce((sum, item) => {
        const price = Number(item.price) || 0;
        const qty = Number(item.quantity) || 1;
        return sum + price * qty;
      }, 0);

      const total = itemsPrice + currentShippingCost;

      itemsPriceEl.textContent = `₱${itemsPrice.toFixed(2)}`;
      shippingPriceEl.textContent = `₱${currentShippingCost.toFixed(2)}`;
      totalPriceEl.textContent = `₱${total.toFixed(2)}`;
    }

    document.querySelectorAll('input[name="deliveryMethod"]').forEach(el => {
      el.addEventListener('change', (e) => {
        currentShippingCost = e.target.value === 'express' ? shippingCostExpress : shippingCostStandard;
        updatePrices();
      });
    });

    function finalizePurchase() {
      const form = document.getElementById('checkoutForm');
      const fields = ['email', 'firstName', 'lastName', 'address1', 'city', 'postalCode'];
      
      for (const field of fields) {
        if (!form[field].value.trim()) {
          alert(`Please fill out your ${field.replace(/([A-Z])/g, ' $1').toLowerCase()}.`);
          form[field].focus();
          return;
        }
      }

      const paymentMethod = form.querySelector('input[name="paymentMethod"]:checked');
      if (!paymentMethod) {
        alert("Please select a payment method.");
        return;
      }

      alert("✅ Thank you for your purchase! Redirecting to confirmation page...");
      closeCheckoutModal();
      window.location.href = "transact.html";
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').style.display = 'none';
    }
  </script>
</body>
</html>

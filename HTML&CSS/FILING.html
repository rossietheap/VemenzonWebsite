  <script>
    const products = [
      { name: "Folder Colored", price: 50, img: "https://cf.shopee.ph/file/48a1266f97b2fdcba001ebb76c503501" },
      { name: "Clip board", price: 50, img: "https://m.media-amazon.com/images/I/91JUvzO6txL.jpg" },
      { name: "Paper Clips", price: 50, img: "https://m.media-amazon.com/images/I/81sZqVR8xfL._AC_SL1500_.jpg" },
      { name: "Statement Envelope", price: 50, img: "https://img.lazcdn.com/g/p/908d5b5b9db6d5a0848ef6cba47a8381.jpg_720x720q80.jpg" },
      { name: "Plastic Envelope", price: 50, img: "https://images-na.ssl-images-amazon.com/images/I/61HRR9DiHnL._SL1200_.jpg" },
      { name: "Zipper Envelope", price: 50, img: "https://content.etilize.com/2000/1028973495.jpg" },
      { name: "Clip Dispenser", price: 50, img: "https://m.media-amazon.com/images/I/71c7T4sjtbL._AC_SL1500_.jpg" },
      { name: "Pushlock Envelope", price: 50, img: "https://tse2.mm.bing.net/th/id/OIP.aCeshgpghRYaytZbyRvk-AHaHa?cb=12&rs=1&pid=ImgDetMain&o=7&rm=3" },
      { name: "Clear File", price: 50, img: "https://target.scene7.com/is/image/Target/GUEST_173c36af-4a76-4f53-8a53-42db03903fb6" },
      { name: "Expanding File", price: 50, img: "https://cf.shopee.ph/file/cef724b981665b78f7369ba355bcf911" },
      { name: "Report Cover", price: 50, img: "https://m.media-amazon.com/images/I/817tMXKxxbL._AC_SL1500_.jpg" },
      { name: "Name Card Holder", price: 50, img: "https://m.media-amazon.com/images/I/71GtGaNymkL._AC_SL1500_.jpg" },
      { name: "Easy Clear File", price: 50, img: "https://cdn.shopclues.com/images/detailed/38681/93711132TransaparentFolder51440910879_1465144008.jpg" },
      { name: "Sheet Protector", price: 50, img: "https://m.media-amazon.com/images/I/61lYCqQKokL._AC_SL1500_.jpg" },
      { name: "Box File", price: 50, img: "https://image.indonetwork.co.id/normal/categories/1511763347.jpg" },
      { name: "Envelope Colored", price: 50, img: "https://thumbs.dreamstime.com/b/colorful-envelope-4-2683496.jpg" },
      { name: "Expanding Envelope", price: 50, img: "https://target.scene7.com/is/image/Target/GUEST_bc69caa8-1c1b-4dc3-abf5-a643e4517ff5" },
      { name: "Multi Pocket File Folder", price: 50, img: "https://tse2.mm.bing.net/th/id/OIP.GlrsTb-0EETEBagq2vlGvgHaHa?cb=12&w=1400&h=1400&rs=1&pid=ImgDetMain&o=7&rm=3" },
    ];

    const grid = document.getElementById('productGrid');


    function viewProduct(product) {
      localStorage.setItem("selectedProduct", JSON.stringify(product));
      window.location.href = "PRODUCTDETAILS.html";
    }

    function loadProducts() {
      grid.innerHTML = '';
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
        <img src="${p.img}" alt="${p.name}" onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">  <!-- Made image clickable to view details -->
          <h3 onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">${p.name}</h3>  <!-- Made title clickable too -->
          <p class="price">₱${p.price}.00</p>
          <div class="buttons">
            <label class="heart-toggle">
              <input type="checkbox" onchange="addToFavorites('${p.name}','${p.img}',${p.price}, this)">
              <span class="heart-btn">♡</span>
            </label>
            <button class="cart-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">
              <iconify-icon icon="mdi:cart-outline"></iconify-icon>
            </button>
           <button class="buy-btn" onclick="viewProduct({ name: '${p.name}', img: '${p.img}', price: ${p.price} })">Buy</button>
          </div>
      `;
        grid.appendChild(card);
      });
    }

    function addToCart(name, img, price) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name, img, price });
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${name} added to cart!`);
    }

    function addToFavorites(name, img, price, btn) {
      const favs = JSON.parse(localStorage.getItem('favorites')) || [];
      favs.push({ name, img, price });
      localStorage.setItem('favorites', JSON.stringify(favs));
      btn.classList.add('active');
    }

    function searchProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      grid.innerHTML = '';
      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
        <img src="${p.img}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="price">₱${p.price}.00</p>
        <div class="buttons">
          <button class="buy-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">Buy</button>
           <button class="buy-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">🛒</button>
          <button class="heart-btn" onclick="addToFavorites('${p.name}','${p.img}',${p.price}, this)">♡</button>
        </div>
      `;
        grid.appendChild(card);
      });
    }

    loadProducts();
  </script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | VemenZon</title>

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;

            /* Full Image School Background */
            background: 
                linear-gradient(rgba(150, 0, 0, 0.55), rgba(120, 0, 0, 0.75)),
                url('https://greenily.co/wp-content/uploads/2016/06/schoolsuppliespic.jpeg') center/cover no-repeat;
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Card container */
        .box {
            background: rgba(255, 255, 255, 0.96);
            width: 90%;
            max-width: 540px;
            padding: 50px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            opacity: 0;
            animation: fadeIn 1.2s forwards ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 160px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #111;
            margin-bottom: 12px;
            letter-spacing: -.5px;
        }

        p {
            color: #3a3a3a;
            font-size: 17px;
            line-height: 1.65;
            max-width: 420px;
            margin: auto;
        }

        /* Red VemenZon Button */
        .btn {
            display: inline-block;
            margin-top: 30px;
            background: #d62828;
            padding: 14px 32px;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            box-shadow: 0 6px 14px rgba(214, 40, 40, 0.32);
            transition: 0.25s ease;
        }

        .btn:hover {
            background: #b11f1f;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="box">
        <img src="Group 1.png" class="logo" alt="Logo">

        <h1>Thank You for Your Purchase!</h1>

        <p>
            Your order is confirmed and we're preparing it for delivery.  
            A confirmation has been sent to you with all the details, kindly check your Profile.
            Thank you for choosing Vemenzon, your one-stop school shop!
        </p>

        <a href="profile.html" class="btn">Continue</a>
    </div>

</body>
</html>

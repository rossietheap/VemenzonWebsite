    const products = [

      { name: "Yellow pad", price: 50, img: "https://www.nationalbookstore.com/180048-thickbox_default/best-buy-yellow-pad-8-5x13-inches-80s-school-office-supplies.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Classic yellow pad for writing." },
      { name: "Colored Pad", price: 50, img: "https://m.media-amazon.com/images/I/41I7vKcxSlL._AC_.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Colorful pad for creative notes." },
      { name: "Writing Notebook", price: 50, img: "https://down-ph.img.susercontent.com/file/sg-11134201-22090-jk8cnrcxmxhv16", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Reliable notebook for writing." },
      { name: "Sheet Protector", price: 50, img: "https://m.media-amazon.com/images/I/61lYCqQKokL._AC_SL1500_.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Protects your important sheets." },
      { name: "Thumbtacks", price: 50, img: "https://cf.shopee.ph/file/cada3cec8b4d058ba64b9a812560607b", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Essential thumbtacks for pinning." },
      { name: "Paper Clips", price: 50, img: "https://m.media-amazon.com/images/I/81sZqVR8xfL._AC_SL1500_.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Standard paper clips." },
      { name: "Clip Dispenser", price: 50, img: "https://m.media-amazon.com/images/I/71c7T4sjtbL._AC_SL1500_.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Convenient dispenser for clips." },
      { name: "Correction Tape (5m)", price: 50, img: "https://caterqatar.com/wp-content/uploads/2025/02/CORRECTION-TAPE-5M-5MM-CT805-PARTNR.png", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "5m correction tape for errors." },
      { name: "Pencil Lead", price: 50, img: "https://i5.walmartimages.com/seo/BIC-Xtra-Strong-Mechanical-Lead-Pencil-Colorful-Barrel-Thick-Point-0-9mm-10-Count-Lead-Pencils-Pencil-Mechanical-Pencil_004b7265-9fcc-4edf-8686-ecced7391ee3.bb30a39f77d9f26b78ee4e968088af20.jpeg", brand: "BIC", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Strong pencil lead for writing." },
      { name: "WhiteBoard Pentel Pen", price: 50, img: "https://5.imimg.com/data5/IS/BN/MY-45773064/whiteboard-marker-8-pen-pack-500x500.jpg", brand: "Pentel", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Perfect for classrooms, offices, and home use. Easy to erase and refillable." },

      { name: "Bag Fullprint", price: 50, img: "https://www.nationalbookstore.com/148881-home_default/backpack-full-print-14-inches-light-space-and-rocket-school-bags.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Stylish full-print backpack." },
      { name: "Bag Geometric", price: 50, img: "https://www.nationalbookstore.com/148897-home_default/backpack-full-print-16-inches-geometric-school-bags.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Geometric design backpack." },
      { name: "Yellow Chalk", price: 50, img: "https://hbw.ph/wp-content/uploads/2017/10/12-pcs-yellow-chalk-600x600.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Yellow chalk for blackboards." },
      { name: "Clear File", price: 50, img: "https://cpimg.tistatic.com/06020413/b/4/Clear-File-Folder.jpg", brand: "Generic", stock: "Available", shipping: "Guaranteed to get by 5-7 Days", description: "Transparent file folder." },
    ];


    const grid = document.getElementById('productGrid');


   
    function viewProduct(product) {
      localStorage.setItem("selectedProduct", JSON.stringify(product));
      window.location.href = "PRODUCTDETAILS.html";
    }


    function loadProducts() {
      grid.innerHTML = '';
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.img}" alt="${p.name}" onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">  <!-- Made image clickable to view details -->
          <h3 onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">${p.name}</h3>  <!-- Made title clickable too -->
          <p class="price">₱${p.price}.00</p>
          <div class="buttons">
            <label class="heart-toggle">
              <input type="checkbox" onchange="addToFavorites('${p.name}','${p.img}',${p.price}, this)">
              <span class="heart-btn">♡</span>
            </label>
            <button class="cart-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">
              <iconify-icon icon="mdi:cart-outline"></iconify-icon>
            </button>
           <button class="buy-btn" onclick="viewProduct({ name: '${p.name}', img: '${p.img}', price: ${p.price} })">Buy</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }


    function addToCart(name, img, price) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name, img, price });
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${name} added to cart!`);
    }


    function addToFavorites(name, img, price, btn) {
      const favs = JSON.parse(localStorage.getItem('favorites')) || [];
      favs.push({ name, img, price });
      localStorage.setItem('favorites', JSON.stringify(favs));
      btn.classList.add('active');
    }


    function searchProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      grid.innerHTML = '';
      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.img}" alt="${p.name}" onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">
          <h3 onclick="viewProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="cursor: pointer;">${p.name}</h3>
          <p class="price">₱${p.price}.00</p>
          <div class="buttons">
            <button class="buy-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">Buy</button>
            <button class="buy-btn" onclick="addToCart('${p.name}','${p.img}',${p.price})">🛒</button>
            <button class="heart-btn" onclick="addToFavorites('${p.name}','${p.img}',${p.price}, this)">♡</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }


    loadProducts();
  </script>
